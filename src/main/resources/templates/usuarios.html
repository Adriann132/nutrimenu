<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NutriMenu - Panel de Control</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Gestión de Usuarios - NutriMenu</h2>
        </div>
        <div class="card-body">

            <form th:action="@{/api/usuarios}" method="post" class="row g-3 mb-4">
                <div class="col-auto">
                    <input type="text" name="nombre" class="form-control" placeholder="Nombre del nuevo usuario" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-success">Registrar Usuario</button>
                </div>
            </form>

            <hr>

            <h4 class="mt-4">Usuarios Registrados</h4>
            <table class="table table-hover mt-3">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.nombre}">Adrian</td>
                    <td>
                        <a th:href="@{/api/{id}/menus(id=${u.id})}" class="btn btn-sm btn-info text-white">Ver Menús</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
